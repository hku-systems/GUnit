# fuzzer/Cargo.toml
[package]
name = "cuda-fuzzer"
version = "0.1.0"
edition = "2021"

[features]
default = []
introspection = ["libafl/introspection"]
track_hit_feedbacks = ["libafl/track_hit_feedbacks"]
profiling = []

# Define library
[lib]
name = "cuda_fuzzer"
path = "src/lib.rs"

# Define binary targets
[[bin]]
name = "fuzzer"
path = "src/bin/fuzzer.rs"

[[bin]]
name = "fuzzer_async"
path = "src/bin/fuzzer_async.rs"

# Add local LibAFL path as dependency
[dependencies]
env_logger = "0.10.0"
fs2 = "0.4"
log = "0.4"
libafl = { path = "../LibAFL/crates/libafl" }
libafl_bolts = { path = "../LibAFL/crates/libafl_bolts" }
libafl_targets = { path = "../LibAFL/crates/libafl_targets" }

# Keep other dependencies unchanged
libloading = "0.8"
rand = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
postcard = { version = "1.0", features = ["alloc"] }
